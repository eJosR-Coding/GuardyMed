[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardymed-api"
version = "0.1.0"
description = "GuardyMed AI-first FastAPI phase 1 skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.118,<0.119",
  "uvicorn[standard]>=0.37,<0.38",
  "pydantic-settings>=2.10,<2.11",
  "sqlalchemy>=2.0,<2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<8.5",
  "httpx>=0.28,<0.29",
]
cv = [
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.10,<5",
  "onnxruntime>=1.22,<2",
  "insightface>=0.7.3,<0.8",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "legacy*"]
